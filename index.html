<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美光 CDS/WCCS 專家設計工具</title>
    <!-- 引入 React 與 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 以支援 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes flowAnimation {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }
        .animate-flow {
            stroke-dasharray: 8 4;
            animation: flowAnimation 0.8s linear infinite;
        }
        .fast-flow {
            stroke-dasharray: 8 4;
            animation: flowAnimation 0.4s linear infinite;
        }
        .slow-flow {
            stroke-dasharray: 8 4;
            animation: flowAnimation 1.5s linear infinite;
        }
        /* 隱藏數字輸入框的上下箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-20">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 化學品資料庫 (保留原始資料)
        const chemicalsData = [
            { name: 'TMAH 0.063%', viscosity: 1.0, sg: 1.0, flash: 'N/A', category: 'Caustic', material: 'PFA 451HP + CPVC', pumpType: 'Mag-drive Centrifugal (磁力離心泵)', avl: 'Iwaki / Flowserve', notes: '一般鹼液，低濃度。' },
            { name: 'TMAH 2.38%', viscosity: 1.0, sg: 1.0, flash: 'N/A', category: 'Caustic', material: 'PFA 451HP + CPVC', pumpType: 'Mag-drive Centrifugal (磁力離心泵)', avl: 'Iwaki / Flowserve', notes: '高毒性，精度要求高，需配置線上滴定儀。' },
            { name: 'NH4OH 2%', viscosity: 1.0, sg: 0.99, flash: 'N/A', category: 'Caustic', material: 'PFA 451HP + CPVC', pumpType: 'Mag-drive Centrifugal (磁力離心泵)', avl: 'Iwaki / Flowserve', notes: '一般鹼液。' },
            { name: 'NH4OH 29%', viscosity: 1.2, sg: 0.9, flash: 'N/A', category: 'Caustic', material: 'PFA 951HP + CPVC', pumpType: 'Mag-drive Centrifugal (磁力離心泵)', avl: 'Iwaki / Flowserve', notes: '高濃度氨水，排氣系統需特別處理避免結晶。' },
            { name: 'NTD-DP001', viscosity: 1.2, sg: 0.95, flash: '44.0°C', category: 'Solvent', material: 'SUS316L EP (自動銲接)', pumpType: 'Pneumatic Diaphragm (防爆氣動泵)', avl: 'Almatec / Yamada', notes: '光阻溶劑，易燃。流速嚴格限制 < 1.0 m/s，需全面防爆接地。' },
            { name: 'RP002', viscosity: 1.004, sg: 0.81, flash: '45.5°C', category: 'Solvent', material: 'SUS316L EP (自動銲接)', pumpType: 'Pneumatic Diaphragm (防爆氣動泵)', avl: 'Almatec / Yamada', notes: '光阻溶劑，易燃。流速限制 < 1.0 m/s。' },
            { name: 'H2O2 31%', viscosity: 1.11, sg: 1.12, flash: 'N/A', category: 'Oxidizer', material: 'PFA 451HP + CPVC', pumpType: 'Mag-drive Centrifugal (磁力離心泵)', avl: 'Iwaki / Flowserve', notes: '強氧化劑。儲槽嚴禁 N2 Blanket (氮氣封存)，需配備 PTFE 呼吸閥。' },
            { name: 'H2SO4 98%', viscosity: 19.0, sg: 1.84, flash: 'N/A', category: 'Acid', material: 'PFA 951HP + CPVC', pumpType: 'Pneumatic Bellows / Diaphragm (高壓氣動泵)', avl: 'White Knight / Almatec', notes: '高黏度強酸。高耗能，需雙主管設計；混合遇水有高溫放熱危險。' },
            { name: 'HF 49%', viscosity: 1.1, sg: 1.15, flash: 'N/A', category: 'Acid', material: 'PFA 951HP + CPVC', pumpType: 'Pneumatic / Mag-drive', avl: 'White Knight / Iwaki', notes: '極強腐蝕性。桶槽底部排液閥需選用 PVDF 材質。' },
            { name: 'HNO3 70%', viscosity: 2.3, sg: 1.42, flash: 'N/A', category: 'Acid', material: 'PFA 951HP + CPVC', pumpType: 'Mag-drive Centrifugal (磁力離心泵)', avl: 'Iwaki / Flowserve', notes: '強酸，需注意管材抗氧化性。' },
            { name: 'HCl 37%', viscosity: 1.9, sg: 1.19, flash: 'N/A', category: 'Acid', material: 'PFA 951HP + CPVC', pumpType: 'Mag-drive Centrifugal (磁力離心泵)', avl: 'Iwaki / Flowserve', notes: '發煙性強酸，儲槽需配置 Exhausted enclosure。' },
            { name: 'NaOH (Salix)', viscosity: 2.0, sg: 1.2, flash: 'N/A', category: 'Caustic', material: 'Transfer: SUS304 / Supply: PFA', pumpType: 'Mag-drive Centrifugal (磁力離心泵)', avl: 'Iwaki / Flowserve', notes: 'Transfer 管線可用 SUS304，但 Supply 供應端須用 PFA 確保潔淨度。' },
            { name: 'IPA', viscosity: 2.0, sg: 0.78, flash: '12.0°C', category: 'Solvent', material: 'SUS316L EP (自動銲接)', pumpType: 'Pneumatic Diaphragm (防爆氣動泵)', avl: 'Almatec / Yamada', notes: '大宗易燃溶劑，流速 < 1.0 m/s，系統需具備防爆箱與靜電接地。' },
            { name: 'PGMEA', viscosity: 1.1, sg: 0.97, flash: '42.0°C', category: 'Solvent', material: 'SUS316L EP (自動銲接)', pumpType: 'Pneumatic Diaphragm (防爆氣動泵)', avl: 'Almatec / Yamada', notes: '大宗易燃溶劑，流速 < 1.0 m/s，管路需採用自動銲接。' },
            { name: 'CuSO4', viscosity: 1.1, sg: 1.1, flash: 'N/A', category: 'Acid', material: 'PFA 451HP + CPVC', pumpType: 'Mag-drive / Pneumatic', avl: 'Iwaki / Almatec', notes: '銅廢液收集系統需獨立管路，防止 Fab 交叉污染。' },
            { name: 'EKC-265', viscosity: 10.0, sg: 1.05, flash: '90°C', category: 'Solvent', material: 'SUS316L EP (自動銲接)', pumpType: 'Pneumatic Diaphragm (防爆氣動泵)', avl: 'Almatec / Yamada', notes: '特用高溫溶劑，黏度高，廢液系統需獨立收集桶槽。' }
        ];

        function App() {
            const [selectedIdx, setSelectedIdx] = useState(12); // IPA 索引
            const [flowLPM, setFlowLPM] = useState("2.68");
            const [velocityMS, setVelocityMS] = useState("0.8");
            const [pipeLength, setPipeLength] = useState("400");
            const [toolPressure, setToolPressure] = useState("3.0");
            const [dosDays, setDosDays] = useState("5");
            const [diversityFactor, setDiversityFactor] = useState("80");

            const activeChem = chemicalsData[selectedIdx];
            const nFlow = parseFloat(flowLPM) || 0.01;
            const nVel = parseFloat(velocityMS) || 0.01;
            const nLen = parseFloat(pipeLength) || 0;
            const nPress = parseFloat(toolPressure) || 0;
            const nDos = parseFloat(dosDays) || 0;
            const nDiv = parseFloat(diversityFactor) || 0;

            const calcPipeID = () => {
                const q_m3s = nFlow / 60000;
                const id_m = Math.sqrt((4 * q_m3s) / (Math.PI * nVel));
                return id_m * 1000; 
            };

            const getNominalSize = (id) => {
                if (!id || id <= 0) return { display: "-", isStandardUpgraded: false };
                let theoreticalSize = "";
                if (id <= 16) theoreticalSize = "1/2 inch (15A)";
                else if (id <= 22) theoreticalSize = "3/4 inch (20A)";
                else if (id <= 35) theoreticalSize = "1 inch (25A)";
                else if (id <= 50) theoreticalSize = "1.5 inch (40A)";
                else if (id <= 65) theoreticalSize = "2 inch (50A)";
                else theoreticalSize = "> 2 inch";

                if (id <= 25.4) {
                    return { display: "1 inch (25A)", isStandardUpgraded: true, theory: theoreticalSize };
                }
                return { display: theoreticalSize, isStandardUpgraded: false };
            };

            const calcTankVol = () => {
                const dailyL = nFlow * (nDiv / 100) * 1440;
                return (dailyL * nDos) / 0.85; 
            };

            const calcTotalHead = () => {
                const pipeIDResult = calcPipeID();
                const actualID = pipeIDResult < 25.4 ? 25.4 : pipeIDResult;
                const filterDP = 1.2; 
                const frictionLoss = (0.002 * activeChem.viscosity * nFlow * nLen) / Math.pow(actualID || 1, 2);
                return nPress + filterDP + frictionLoss;
            };

            // 修復：重新加入缺失的計算函數
            const calcPumpPower = (head) => (nFlow * head * 10) / 2250;
            const calcCDA = (head) => nFlow * (head / 1.5) * 1.5;

            const getPumpRecommendation = (flow, chem) => {
                const isSolvent = chem.category === 'Solvent';
                const isPneumatic = chem.pumpType.includes('Pneumatic') || chem.pumpType.includes('氣動');
                if (isPneumatic) {
                    if (flow <= 15) return isSolvent ? "Yamada NDP-15BST" : "White Knight PSA-15";
                    else if (flow <= 60) return isSolvent ? "Yamada NDP-25BST" : "White Knight PSA-25";
                    else return isSolvent ? "Yamada NDP-40BST" : "White Knight PSA-40";
                } else {
                    if (flow <= 30) return "Iwaki MDM-25";
                    else if (flow <= 100) return "Iwaki MDM-40";
                    else return "Iwaki MDM-50";
                }
            };

            const getFilterRecommendation = (flow, chem) => {
                const housingMat = chem.category === 'Solvent' ? "SUS316L EP" : "PFA";
                let sizeSuggest = "";
                if (flow <= 20) sizeSuggest = '10" x 1';
                else if (flow <= 60) sizeSuggest = '20" x 1';
                else if (flow <= 120) sizeSuggest = '20" x 2';
                else sizeSuggest = 'Multi-round';
                return { housingMat, sizeSuggest, vendors: "Entegris / Pall" };
            };

            const pipeID = calcPipeID();
            const nomSizeResult = getNominalSize(pipeID);
            const tankVol = calcTankVol();
            const totalHead = calcTotalHead();
            const pumpSpec = getPumpRecommendation(nFlow, activeChem);
            const filterSpec = getFilterRecommendation(nFlow, activeChem);
            const isPneumatic = activeChem.pumpType.includes('Pneumatic') || activeChem.pumpType.includes('氣動');

            const isSolventHighSpeed = activeChem.category === 'Solvent' && nVel > 1.0;
            const isLowSpeed = nVel < 0.3 && nVel > 0;
            const isLowDOS = nDos < 3;

            const getFlowSpeedClass = () => {
                if (nVel > 2.0) return 'fast-flow';
                if (nVel < 0.8) return 'slow-flow';
                return 'animate-flow';
            };

            const SliderInput = ({ label, unit, min, max, step, value, setValue }) => (
                <div className="flex flex-col gap-2">
                    <label className="text-sm font-semibold text-slate-700 flex justify-between items-center">
                        <span>{label}</span>
                        <div className="flex items-center gap-1 bg-white border border-slate-300 rounded px-2 py-1 focus-within:ring-2 focus-within:ring-blue-500 shadow-sm">
                            <input type="number" step={step} value={value} onChange={e => setValue(e.target.value)} className="w-16 text-right text-blue-700 font-bold outline-none bg-transparent" />
                            <span className="text-slate-500 text-xs w-8 select-none">{unit}</span>
                        </div>
                    </label>
                    <input type="range" min={min} max={max} step={step} value={value === "" ? 0 : value} onChange={e => setValue(e.target.value)} className="w-full accent-blue-600 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-6">
                    <div className="bg-slate-800 text-white p-6 rounded-xl shadow-lg mb-6">
                        <h1 className="text-2xl md:text-3xl font-bold tracking-wide">美光 CDS / WCCS 專家設計工具</h1>
                        <p className="mt-2 text-slate-300">結合 Global Facilities Standard 之流體動力推演與硬體選型</p>
                    </div>

                    {/* 1. 系統設計參數輸入 */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                        <h2 className="text-xl font-bold text-slate-800 mb-4 border-b pb-2 flex items-center">
                            <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded mr-2 text-sm">STEP 1</span>
                            系統設計參數輸入
                        </h2>
                        <div className="mb-6">
                            <label className="block text-sm font-bold text-slate-700 mb-2">選擇化學品 (Chemical Selection)</label>
                            <select className="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 text-lg font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" value={selectedIdx} onChange={(e) => setSelectedIdx(Number(e.target.value))}>
                                {chemicalsData.map((chem, idx) => (
                                    <option key={idx} value={idx}>{chem.name}</option>
                                ))}
                            </select>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pt-2">
                            <SliderInput label="需求流量 (Flow Rate)" unit="LPM" min="0.1" max="100" step="0.01" value={flowLPM} setValue={setFlowLPM} />
                            <SliderInput label="設計流速 (Target Velocity)" unit="m/s" min="0.1" max="3.0" step="0.01" value={velocityMS} setValue={setVelocityMS} />
                            <SliderInput label="同時使用率 (Diversity Factor)" unit="%" min="1" max="100" step="1" value={diversityFactor} setValue={setDiversityFactor} />
                            <SliderInput label="庫存天數 (Days of Storage)" unit="Days" min="1" max="10" step="0.5" value={dosDays} setValue={setDosDays} />
                            <SliderInput label="總管長度 (Pipe Length)" unit="m" min="10" max="1000" step="1" value={pipeLength} setValue={setPipeLength} />
                            <SliderInput label="機台需求壓力 (Tool Pressure)" unit="kg/cm²" min="0.5" max="5.0" step="0.1" value={toolPressure} setValue={setToolPressure} />
                        </div>
                    </div>

                    {/* 2. 動態 PFD 昇位圖 */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6 overflow-x-auto">
                        <h2 className="text-xl font-bold text-slate-800 mb-4 border-b pb-2 flex items-center">
                            <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded mr-2 text-sm">STEP 2</span>
                            系統動態昇位圖 (Process Flow Diagram)
                        </h2>
                        <div className="min-w-[850px] h-80 bg-slate-900 rounded-lg flex items-center justify-center relative p-6 shadow-inner overflow-hidden">
                            <svg width="100%" height="100%" viewBox="0 0 900 300" preserveAspectRatio="xMidYMid meet">
                                <style>
                                    {`
                                        .pfd-text { font-family: sans-serif; font-size: 11px; fill: #94a3b8; }
                                        .pfd-val { font-family: monospace; font-size: 12px; font-weight: bold; fill: #38bdf8; }
                                        .pfd-title { font-size: 14px; font-weight: bold; fill: #ffffff; }
                                        .pfd-label-box { fill: #1e293b; stroke: #334155; }
                                    `}
                                </style>
                                <defs>
                                    <marker id="pfd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
                                    </marker>
                                </defs>

                                {/* 1. LORRY (卸載槽車) */}
                                <g transform="translate(40, 150)">
                                    <path d="M 0 20 L 70 20 L 80 45 L 0 45 Z" fill="#334155" />
                                    <rect x="5" y="5" width="60" height="30" rx="3" fill="#475569" stroke="#94a3b8" />
                                    <circle cx="15" cy="48" r="6" fill="#000" />
                                    <circle cx="65" cy="48" r="6" fill="#000" />
                                    <text x="40" y="75" textAnchor="middle" className="pfd-title">LORRY</text>
                                </g>

                                {/* 2. STORAGE TANK (儲槽) */}
                                <g transform="translate(280, 120)">
                                    <rect x="-10" y="-60" width="140" height="40" rx="4" className="pfd-label-box" />
                                    <text x="60" y="-42" textAnchor="middle" className="pfd-text">TANK CAPACITY</text>
                                    <text x="60" y="-25" textAnchor="middle" className="pfd-val">{Math.round(tankVol).toLocaleString()} L</text>
                                    
                                    <rect x="0" y="0" width="50" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" strokeWidth="2" />
                                    <rect x="70" y="0" width="50" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" strokeWidth="2" />
                                    <text x="60" y="110" textAnchor="middle" className="pfd-title">STORAGE TANK</text>
                                </g>

                                {/* 3. CDU (供應機台) */}
                                <g transform="translate(560, 80)">
                                    <rect x="-10" y="-60" width="220" height="45" rx="4" className="pfd-label-box" />
                                    <text x="100" y="-45" textAnchor="middle" className="pfd-text">PUMP: {pumpSpec} / {activeChem.category === 'Solvent' ? 'SUS' : 'PFA'}</text>
                                    <text x="100" y="-28" textAnchor="middle" className="pfd-text">FILTER: {filterSpec.sizeSuggest} / Housing: {filterSpec.housingMat}</text>

                                    <rect x="0" y="0" width="200" height="180" rx="6" fill="none" stroke="#64748b" strokeDasharray="4 2" />
                                    <circle cx="60" cy="90" r="25" fill="#1e293b" stroke="#ef4444" strokeWidth="2" />
                                    <text x="60" y="93" textAnchor="middle" fill="#ef4444" fontWeight="bold" fontSize="9">PUMP</text>
                                    <rect x="120" y="60" width="40" height="70" rx="2" fill="#1e293b" stroke="#10b981" strokeWidth="2" />
                                    <line x1="120" y1="95" x2="160" y2="95" stroke="#10b981" />
                                    <text x="100" y="200" textAnchor="middle" className="pfd-title">CDU CABINET</text>
                                </g>

                                {/* 4. VMB (閥箱) */}
                                <g transform="translate(820, 150)">
                                    <rect x="0" y="0" width="50" height="70" rx="4" fill="#1e293b" stroke="#10b981" strokeWidth="2" />
                                    <circle cx="25" cy="20" r="3" fill="#10b981" />
                                    <circle cx="25" cy="35" r="3" fill="#10b981" />
                                    <circle cx="25" cy="50" r="3" fill="#10b981" />
                                    <text x="25" y="90" textAnchor="middle" className="pfd-title">VMB</text>
                                </g>

                                <g fill="none" stroke="#334155" strokeWidth="4" strokeLinejoin="round">
                                    <path d="M 120 185 L 200 185 L 200 170 L 280 170" />
                                    <path d="M 120 185 L 200 185 L 200 170 L 280 170" stroke="#38bdf8" strokeWidth="2" className="animate-flow" markerEnd="url(#pfd-arrow)" />
                                    <text x="200" y="205" textAnchor="middle" className="pfd-val" fill="#38bdf8" fontSize="10">2" (50A)</text>

                                    <path d="M 400 170 L 480 170 L 480 140 L 560 140" />
                                    <path d="M 400 170 L 480 170 L 480 140 L 560 140" stroke="#38bdf8" strokeWidth="2" className={getFlowSpeedClass()} markerEnd="url(#pfd-arrow)" />
                                    <rect x="440" y="145" width="80" height="15" rx="3" fill="#0f172a" />
                                    <text x="480" y="156" textAnchor="middle" className="pfd-val" fill="#38bdf8" fontSize="9">{nomSizeResult.display}</text>

                                    <path d="M 760 140 L 790 140 L 790 185 L 820 185" />
                                    <path d="M 760 140 L 790 140 L 790 185 L 820 185" stroke="#10b981" strokeWidth="2" className={getFlowSpeedClass()} markerEnd="url(#pfd-arrow)" />
                                    <text x="795" y="130" textAnchor="middle" className="pfd-val" fill="#10b981" fontSize="9">{nomSizeResult.display}</text>
                                </g>
                            </svg>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                        {/* 3. 流體特性 */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h2 className="text-xl font-bold text-slate-800 mb-4 border-b pb-2 flex items-center">
                                <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded mr-2 text-sm">STEP 3</span>
                                流體物理特性
                            </h2>
                            <ul className="space-y-3">
                                <li className="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                                    <span className="text-slate-600 font-semibold">化學品分類 (Category)</span>
                                    <span className="font-bold text-purple-700">{activeChem.category}</span>
                                </li>
                                <li className="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                                    <span className="text-slate-600 font-semibold">絕對黏度 (Viscosity)</span>
                                    <span className="font-bold text-slate-800">{activeChem.viscosity.toFixed(2)} cP</span>
                                </li>
                                <li className="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                                    <span className="text-slate-600 font-semibold">比重 (Specific Gravity)</span>
                                    <span className="font-bold text-slate-800">{activeChem.sg.toFixed(2)}</span>
                                </li>
                                <li className="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                                    <span className="text-slate-600 font-semibold">閃火點 (Flash Point)</span>
                                    <span className="font-bold text-slate-800">{activeChem.flash}</span>
                                </li>
                            </ul>
                        </div>

                        {/* 4. 水力計算 */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                            <h2 className="text-xl font-bold text-slate-800 mb-4 border-b pb-2 flex items-center">
                                <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded mr-2 text-sm">STEP 4</span>
                                系統水力設計數據
                            </h2>
                            <ul className="space-y-3">
                                <li className="flex justify-between items-center">
                                    <span className="text-slate-600 font-semibold">計算內徑 (Calculated ID)</span>
                                    <span className="font-bold text-xl text-slate-800">{pipeID.toFixed(2)} mm</span>
                                </li>
                                <li className="flex justify-between items-center">
                                    <div className="flex flex-col">
                                        <span className="text-slate-600 font-semibold">標稱管徑 (Nominal)</span>
                                        {nomSizeResult.isStandardUpgraded && (
                                            <span className="text-[10px] text-blue-500 font-bold italic">理論值: {nomSizeResult.theory}</span>
                                        )}
                                    </div>
                                    <div className="flex flex-col items-end">
                                        <span className="font-bold text-xl text-orange-600">{nomSizeResult.display}</span>
                                        {nomSizeResult.isStandardUpgraded && (
                                            <span className="text-[10px] bg-blue-500 text-white px-1 rounded">美光規範要求</span>
                                        )}
                                    </div>
                                </li>
                                <li className="flex justify-between items-center">
                                    <span className="text-slate-600 font-semibold">單槽設計容積 (Tank Vol)</span>
                                    <span className="font-bold text-2xl text-red-600">{Math.round(tankVol).toLocaleString()} L</span>
                                </li>
                                <li className="flex justify-between items-center border-t border-slate-100 pt-3">
                                    <span className="text-slate-600 font-semibold">預估總揚程 (Total Head)</span>
                                    <span className="font-bold text-2xl text-emerald-600">{totalHead.toFixed(2)} kg/cm²</span>
                                </li>
                            </ul>
                        </div>
                    </div>

                    {/* 5. 硬體與規範 */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                        <h2 className="text-xl font-bold text-slate-800 mb-4 border-b pb-2 flex items-center">
                            <span className="bg-blue-100 text-blue-700 px-2 py-1 rounded mr-2 text-sm">STEP 5</span>
                            設備硬體選型與 AVL (Approved Vendor List)
                        </h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="space-y-4">
                                <div className="p-4 bg-slate-50 rounded-lg border border-slate-200">
                                    <p className="text-sm text-slate-500 font-bold mb-1">建議管路材質</p>
                                    <p className="text-lg font-bold text-slate-800">{activeChem.material}</p>
                                    <p className="text-sm text-slate-500 mt-2">供應商: Entegris / GF / Agru</p>
                                </div>
                                <div className="p-4 bg-blue-50 rounded-lg border border-blue-200 shadow-inner">
                                    <p className="text-sm text-blue-800 font-bold mb-1">過濾器選型建議 (Filter Sizing)</p>
                                    <p className="text-base font-bold text-blue-900 mt-2">{filterSpec.sizeSuggest}</p>
                                    <p className="text-sm text-blue-700 mt-1">濾殼材質: {filterSpec.housingMat}</p>
                                    <p className="text-sm text-blue-700 mt-2">合格品牌: {filterSpec.vendors}</p>
                                </div>
                                <div className="p-4 bg-slate-50 rounded-lg border border-slate-200">
                                    <p className="text-sm text-slate-500 font-bold mb-1">桶槽建置規劃</p>
                                    <p className="text-lg font-bold text-slate-800">2 台 (落實 N+1 備援)</p>
                                    <p className="text-sm text-slate-500 mt-2">供應商: Allied Supreme (上品) / Edlon</p>
                                </div>
                            </div>
                            <div className="space-y-4 h-full">
                                <div className="p-5 bg-emerald-50 rounded-lg border border-emerald-200 shadow-inner h-full flex flex-col justify-between">
                                    <div>
                                        <p className="text-sm text-emerald-800 font-bold mb-2">泵浦選型推薦 (Pump Selection)</p>
                                        <p className="text-xl font-bold text-emerald-900 leading-tight">{pumpSpec}</p>
                                        <div className="mt-4 pt-4 border-t border-emerald-200">
                                            <p className="text-sm text-emerald-800 font-bold mb-1">動力需求估算</p>
                                            {isPneumatic ? (
                                                <p className="text-lg font-bold text-blue-700">預估耗氣量: {calcCDA(totalHead).toFixed(0)} LPM (CDA)</p>
                                            ) : (
                                                <p className="text-lg font-bold text-emerald-700">預估馬力需求: {calcPumpPower(totalHead).toFixed(2)} HP</p>
                                            )}
                                        </div>
                                    </div>
                                    <div className="mt-4 pt-4 border-t border-emerald-200">
                                        <p className="text-sm text-emerald-700 font-bold">美光合格品牌 (AVL):</p>
                                        <p className="text-base text-emerald-900 font-semibold">{activeChem.avl}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* 6. 注意事項 */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border-l-8 border-amber-400">
                        <h2 className="text-xl font-bold text-slate-800 mb-4 border-b pb-2 flex items-center">
                            安全與設計注意事項
                        </h2>
                        <ul className="space-y-3">
                            <li className="flex gap-3 items-start text-lg text-slate-800">
                                <span className="text-amber-500 mt-1">📌</span>
                                <span>{activeChem.notes}</span>
                            </li>
                            {nomSizeResult.isStandardUpgraded && (
                                <li className="flex gap-3 items-start text-lg text-blue-700 font-bold bg-blue-50 p-4 rounded-lg border border-blue-200">
                                    <span>🛡️</span>
                                    <span>規範備註：依據 Global Standard (CDS Standard)，供應主管路最低標稱尺寸必須為 1 inch (25A)。</span>
                                </li>
                            )}
                            {isSolventHighSpeed && (
                                <li className="flex gap-3 items-start text-lg text-red-700 font-bold bg-red-50 p-4 rounded-lg border border-red-200">
                                    <span>⚠️</span>
                                    <span>警告：{activeChem.name} 為易燃溶劑，流速不應超過 1.0 m/s 以避免靜電風險。</span>
                                </li>
                            )}
                            {isLowSpeed && (
                                <li className="flex gap-3 items-start text-lg text-amber-700 font-bold bg-amber-50 p-4 rounded-lg border border-amber-200">
                                    <span>⚠️</span>
                                    <span>警告：流速低於 0.3 m/s，需注意微粒沉澱。</span>
                                </li>
                            )}
                        </ul>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
